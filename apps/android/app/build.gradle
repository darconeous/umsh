plugins { id 'com.android.application' }
android {
    namespace 'dev.umsh.android'
    compileSdk 35
    ndkVersion '28.0.13004108'
    defaultConfig {
        applicationId 'dev.umsh.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    packaging { jniLibs { useLegacyPackaging = false } }
}
tasks.register('verifyNativeCore') {
    doLast {
        if (fileTree('src/main/jniLibs').matching { include '**/libumsh_android.so' }.isEmpty()) {
            throw new GradleException('Build the Rust core first: ./scripts/build-native.sh')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyNativeCore' }
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
android.testOptions.unitTests.includeAndroidResources = true
tasks.withType(Test).configureEach {
    systemProperty 'java.library.path', file('../native/target/debug').absolutePath
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
}
