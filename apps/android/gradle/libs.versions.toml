[versions]
agp = "9.5.1"
# AGP 9 compiles Kotlin itself and depends on an older Kotlin Gradle plugin;
# the root build script's classpath raises it to this.
kotlin = "2.4.21"
# 16 KB page alignment: the NDK aligns by default from r28.
ndk = "28.2.13676358"
compileSdk = "37"
# What Google Play currently requires; raised when Play raises it.
targetSdk = "36"
minSdk = "31"
# `libjnidispatch.so` got its 16 KB page fixes in 5.16 and 5.17.
jna = "5.19.1"
coroutines = "1.11.0"
junit = "4.13.2"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
