# Thin libFuzzer wrappers over umsh-fuzz-harness, in a workspace of their own
# so the root's size-tuned release profile stays out of the way. Nothing here
# but `fuzz_target!`: the harness lives in crates/umsh-fuzz-harness, where
# `cargo test` keeps it building. The harness avoids umsh-ulcp-runtime, the
# one crate that reaches the root's `[patch]` entries, so none are needed here.
[package]
name = "umsh-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
umsh-fuzz-harness = { path = "../crates/umsh-fuzz-harness" }

[workspace]
members = ["."]

[[bin]]
name = "lan_bridge"
path = "fuzz_targets/lan_bridge.rs"
test = false
doc = false
bench = false

[[bin]]
name = "meshcore_forwarder"
