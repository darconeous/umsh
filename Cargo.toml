[workspace]
members = [
    "crates/umsh-core",
    "crates/umsh-ulcp",
    "crates/umsh-ulcp-device",
    "crates/umsh-ulcp-runtime",
    "crates/umsh-crypto",
    "crates/umsh-hal",
    "crates/umsh-uri",
    "crates/umsh-chat-room",
    "crates/umsh-text",
    "crates/umsh-mac",
    "crates/umsh-mobile-core",
    "crates/umsh-node",
    "crates/umsh-sync",
    "crates/umsh-cli",
    "crates/umsh-bsp-nrf52840",
    "crates/umsh-bsp-t1000e",
    "crates/umsh-bsp-techo",
    "crates/umsh-bsp-wio-tracker-l1",
    "crates/umsh-bsp-sensecap-solar",
    "crates/umsh-flash-store",
    "crates/umsh-journal-store",
    "crates/umsh-radio-loraphy",
    "crates/umsh-ux-tracker",
    "crates/umsh-app-ulcp-cli",
    "firmware/t1000e-console",
    "firmware/techo-console",
    "firmware/wio-tracker-l1-console",
    "firmware/sensecap-solar-console",
    "firmware/t1000e",
    "firmware/techo",
    "firmware/sensecap-solar",
    "firmware/ble-spike-techo",
    "tools/ulcp-web-debugger/engine",
    "tools/uniffi-bindgen",
    "umsh",
]
# Root `cargo build` / `cargo check` skips firmware/* so we don't try to
# cross-compile every binary on the developer's host. Firmware crates are
# explicitly built with `cargo build -p firmware-t1000e-console`
# (or by running cargo from inside the firmware directory).
default-members = [
    "crates/umsh-core",
    "crates/umsh-ulcp",
    "crates/umsh-ulcp-device",
    "crates/umsh-ulcp-runtime",
    "crates/umsh-crypto",
    "crates/umsh-hal",
    "crates/umsh-uri",
    "crates/umsh-chat-room",
    "crates/umsh-text",
    "crates/umsh-mac",
    "crates/umsh-mobile-core",
    "crates/umsh-node",
    "crates/umsh-sync",
    "crates/umsh-cli",
    "crates/umsh-bsp-nrf52840",
    "crates/umsh-bsp-t1000e",
    "crates/umsh-bsp-techo",
    "crates/umsh-bsp-wio-tracker-l1",
    "crates/umsh-bsp-sensecap-solar",
    "crates/umsh-flash-store",
    "crates/umsh-journal-store",
    "crates/umsh-ux-tracker",
    "crates/umsh-app-ulcp-cli",
    "tools/ulcp-web-debugger/engine",
    "umsh",
]
resolver = "2"

# Sized for the nRF52840 firmware, the only artifact in this workspace with a
# hard ceiling: 756 KB of application flash on the T-1000E and SenseCAP Solar,
# 760 KB on the T-Echo. At stock release settings the shipping images sat at
# ~87% of that budget; these settings put them near 61%.
#
# `opt-level = "z"` does most of the work — measured on `firmware-t1000e` it is
# worth ~119 KB on its own, and `lto = "fat"` adds a further ~78 KB on top of
# it. The ordering matters: fat LTO at `opt-level = 3` inlines hard enough to
# make the image ~61 KB *larger* than no LTO at all, which is the trap this
# comment exists to keep the next person out of.
#
# Nothing here is CPU-bound enough to miss `opt-level = 3`. The largest single
# beneficiary is `sha2`, whose fully unrolled `compress512` drops from 27,746
# bytes to 10,544; it is reached only through Ed25519 sign/verify, where the
# rolled loop costs microseconds. Everything else runs at LoRa packet rates or
# slower. A per-package `opt-level` override is available if that ever stops
# being true, but note it does not propagate to that package's dependencies.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/darconeous/umsh"

# Override dependencies for the two audited forks carried by UMSH. Trouble is
# pinned to the pairing-policy gate revision; nrf-sdc/nrf-mpsl are pinned to the
# controller revision audited with it. Pins move only after deliberate review.
[patch.crates-io]
lora-phy        = { git = "https://github.com/darconeous/lora-rs.git", rev = "703914572c5900247af30769b0b0875009c1687d" }
lora-modulation = { git = "https://github.com/darconeous/lora-rs.git", rev = "703914572c5900247af30769b0b0875009c1687d" }
trouble-host    = { git = "https://github.com/darconeous/trouble.git", rev = "675edc8a373b58ccdeaf1821653b41e19e595bab" }
nrf-sdc         = { git = "https://github.com/alexmoon/nrf-sdc.git", rev = "abe49d22ebfc85fae134eb082fbfddf752016a55" }
nrf-mpsl        = { git = "https://github.com/alexmoon/nrf-sdc.git", rev = "abe49d22ebfc85fae134eb082fbfddf752016a55" }

[workspace.dependencies]
aes = { version = "0.8", default-features = false }
bitflags = { version = "2", default-features = false }
embedded-hal-async = { version = "1", default-features = false }
curve25519-dalek = { version = "4", default-features = false }
ed25519-dalek = { version = "2.1", default-features = false, features = ["rand_core"] }
hamaddr = { version = "0.1.0", default-features = false }
heapless = { version = "0.8", default-features = false }
# Pre-release version specifier is required so cargo will accept the patched
# `lora-phy = "3.0.2-alpha"` from ../lora-rs. The patch is rejected as "unused"
# under a plain `^3` requirement because Cargo excludes pre-releases by default.
lora-phy = { version = "3.0.2-alpha", default-features = false }
lwuri = { version = "0.1.1", default-features = false }
rand = { version = "0.10.1", default-features = false }
rand_core = { version = "0.6", default-features = false }
sha2 = { version = "0.10", default-features = false }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
zeroize = { version = "1", default-features = false, features = ["derive"] }
