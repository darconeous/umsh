[[boards]]
id = "heltec-v3"
name = "WiFi LoRa 32 V3"
vendor = "Heltec"
category = "devkit"
status = "proven"
status_note = "Validated on hardware, including Bluetooth pairing and over-the-air radio work."
blurb = """
An inexpensive, widely available development board with an OLED display and exposed \
pins. It flashes over the standard ESP32-S3 serial bootloader, which cannot be easily bricked, so \
it is a forgiving board to experiment on."""
mcu = "Espressif ESP32-S3"
radio = "Semtech SX1262"
gnss = "None"
display = "0.96\" OLED, 128×64"
battery = "LiPo connector with onboard charger"
extras = "USB-C, exposed GPIO headers"
vendor_url = "https://heltec.org/project/wifi-lora-32-v3/"
photo = "heltec-v3.png"

[boards.flash]
make_target = "flash-heltec-v3"
methods = ["esp-serial"]
chip = "ESP32-S3"
dfu_entry = "None needed — the board enters its ROM bootloader on its own when the flashing tool asserts the USB serial control lines."
quirks = [
  "Building this board needs Espressif's Xtensa Rust toolchain, installed with <code>espup</code>.",
]

