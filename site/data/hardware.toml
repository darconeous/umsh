# Supported hardware.
#
# This file drives both the hardware page and the flashing instructions, and
# it is the data the web flasher will read once it exists. Board `id` values
# match the presets in `scripts/flash.py` and the `make` target suffixes, so
# keep the three in step. Flash constants (family id, app base, volume) are
# mirrored from that script's BOARDS dict—it stays authoritative; if they
# ever disagree, the script is right.
#
# `bootloader_usb` lists every "vid:pid" the board's bootloader enumerates
# as. The web flasher treats a matching port as already in update mode and
# sends a 1200-baud touch to anything else. The application's own pair lives
# in the board BSP; see "Adding a board" in docs/firmware-architecture.md.
#
# `status` is one of:
#   proven    — brought up and exercised on real hardware
#   partial   — bringup verified on hardware, shipping image not yet run
#   untested  — code complete, never run on the board
#   planned   — documented, not implemented; no [boards.flash] table and no
#               downloadable firmware

# Categories render in this order on the hardware page.
[[categories]]
id = "companion"
name = "Companion radios and trackers"
intro = "Radios that pair with the phone app over Bluetooth. This is where most people start."

[[categories]]
id = "communicator"
name = "Communicators"
intro = "Handhelds with a keyboard and a screen, which work without a phone at all."

[[categories]]
id = "repeater"
name = "Repeaters"
intro = "Nodes meant to be installed somewhere and left running, to extend how far a mesh reaches."

[[categories]]
id = "devkit"
name = "Development boards"
intro = "Open boards for building something of your own, or for working on UMSH itself."

[[boards]]
id = "t1000e"
name = "SenseCAP T1000-E"
vendor = "Seeed Studio"
category = "companion"
status = "proven"
status_note = "The radio, Bluetooth, and GNSS have all been exercised."
blurb = """
A sealed, pocket-sized card tracker with a magnetic charging cable. No screen \
and one button, so it pairs with the phone app rather than standing alone. \
The most thoroughly exercised board in the project."""
mcu = "Nordic nRF52840"
radio = "Semtech LR1110"
gnss = "Airoha AG3335"
display = "None"
battery = "Built-in Li-ion"
extras = "Buzzer, accelerometer, light sensor"
vendor_url = "https://www.seeedstudio.com/SenseCAP-Card-Tracker-T1000-E-for-Meshtastic-p-5913.html"
photo = "t1000e.jpg"

[boards.flash]
make_target = "flash-t1000e"
methods = ["uf2", "serial-dfu"]
family_id = "0x28860057"
bootloader_usb = ["2886:0057"]
app_base = "0x27000"
softdevice = "S140 7.3.0"
volume = "T1000-E"
dfu_entry = "Hold the user button and cycle USB power twice, or run a 1200-baud touch on the serial port."
quirks = [
  "The board is factory-sealed with no debug header, so there is no recovery from a damaged bootloader.",
]

