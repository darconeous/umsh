[boards.flash]
make_target = "flash-techo"
methods = ["uf2", "serial-dfu"]
family_id = "0xADA52840"
app_base = "0x26000"
softdevice = "S140 6.1.1"
volume = "TECHOBOOT"
dfu_entry = "Double-tap the reset button, or run a 1200-baud touch on the serial port."
quirks = [
]

