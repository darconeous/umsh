[[boards]]
id = "tbeam-supreme"
name = "T-Beam Supreme"
vendor = "LilyGO"
category = "devkit"
status = "proven"
status_note = "The radio, display, and GNSS have all been exercised."
blurb = """
The best-equipped board UMSH runs on: an OLED display, a GNSS receiver, a \
real-time clock, an 18650 holder, and a power management chip that owns \
every rail—so "off" is genuinely off, and the board reports what its battery \
is doing. Sold with several different radios; UMSH runs on the SX1262 \
version."""
mcu = "Espressif ESP32-S3"
radio = "Semtech SX1262"
gnss = "Quectel L76K or u-blox MAX-M10, by variant"
display = "1.3\" OLED, 128×64"
battery = "18650 cell, with a fuel gauge"
extras = "Real-time clock, environmental sensor, IMU, magnetometer, microSD"
vendor_url = "https://lilygo.cc/en-us/products/t-beam-supreme"
photo = "tbeam-supreme.jpg"

[boards.flash]
make_target = "flash-tbeam-supreme"
methods = ["esp-serial"]
chip = "ESP32-S3"
dfu_entry = "None needed—the board enters its ROM bootloader on its own when the flashing tool asserts the USB serial control lines. If that fails, hold BOOT, tap RESET, then release BOOT."
quirks = [
  "Building this board needs Espressif's Xtensa Rust toolchain, installed with <code>espup</code>.",
  "Only the SX1262 version is supported; the LR1121 version needs a radio driver UMSH does not have.",
]

