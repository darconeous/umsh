[[boards]]
id = "sensecap-solar"
name = "SenseCAP Solar Node P1"
vendor = "Seeed Studio"
category = "repeater"
status = "proven"
status_note = "Radio, Bluetooth, GNSS, and the power path have all been validated on hardware."
blurb = """
An outdoor, solar-powered node built to be mounted somewhere and left alone. \
A 5 W panel and four 18650 cells carry it through bad weather, which is what \
you want from the node that fills in a gap in coverage."""
mcu = "nRF52840"
radio = "Semtech SX1262"
gnss = "Quectel L76K (enabled by default)"
display = "None"
