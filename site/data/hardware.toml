[boards.flash]
make_target = "flash-sensecap-solar"
methods = ["uf2", "serial-dfu"]
family_id = "0x28860044"
app_base = "0x27000"
softdevice = "S140 7.3.0"
volume = "SENSECAP"
dfu_entry = "Double-tap the reset button."
quirks = [
  "From the powered-off state, any press of the PWR button enters the bootloader, however brief. USR is the button that turns the node on.",
