[package]
name = "umsh-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Host-only: the interactive REPL behind the `umsh` crate's `cli_udp` and
# `cli_ulcp` examples. It hard-wires the software crypto back end because PFS
# and channels need it.

[dependencies]
umsh-core = { path = "../umsh-core", features = ["std"] }
umsh-crypto = { path = "../umsh-crypto", features = ["std", "software-crypto"] }
umsh-mac = { path = "../umsh-mac", features = ["std", "software-crypto"] }
umsh-node = { path = "../umsh-node", features = ["std", "software-crypto"] }
umsh-sync = { path = "../umsh-sync" }
umsh-text = { path = "../umsh-text", features = ["std", "software-crypto"] }
futures = "0.3"
indexmap = "2"
tokio = { version = "1", default-features = false, features = ["io-util", "io-std", "macros", "rt"] }

[dev-dependencies]
futures = { version = "0.3", features = ["executor"] }
