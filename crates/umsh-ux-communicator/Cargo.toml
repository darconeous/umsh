[package]
name = "umsh-ux-communicator"
description = "The standalone messenger UI for communicator-class UMSH devices"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The interface of a communicator: a self-contained UMSH device with a color
# screen, a text keyboard, and navigation controls (T-LoRa Pager, T-Deck).
# It renders through Buoyant into any embedded-graphics Rgb565 target and
# takes input as abstract events, so the same code runs on the device and in
# the host communicator. See docs/ux/src/classes/communicators.md.
#
# The bundled fonts are Latin subsets of M+ FONTS (SIL OFL 1.1, see
# fonts/OFL.txt); build.rs rasterizes them into anti-aliased glyph tables.

[features]
# The mockup's chats, for a device with nothing behind it yet. It reads
# typed addresses as a node would, and offers the vetted radio profiles.
fixture = ["dep:umsh-core", "dep:umsh-ulcp"]

[dependencies]
# The fork carries a prerendered anti-aliased font backend, line-limited
# text, focus by key bound into app state, a text field whose text is kept
# in storage the app chooses, images held by value, building an app in
# place, and scroll views that take focus when nothing in them can. Branch
# `umsh` of
# darconeous/buoyant.
buoyant = { git = "https://github.com/darconeous/buoyant", rev = "306ac8166b2d3a80af027ec2576252eebc5b7634", default-features = false, features = ["embedded-graphics", "unicode-segmentation"] }
embedded-graphics = { version = "0.8", default-features = false }
# The touches Buoyant takes.
embedded-touch = "0.3"
heapless = { version = "0.9", default-features = false }
libm = "0.2"
qrcodegen-no-heap = "1.8"
umsh-core = { path = "../umsh-core", default-features = false, optional = true }
umsh-ulcp = { path = "../umsh-ulcp", optional = true }
umsh-hal = { path = "../umsh-hal", default-features = false }
umsh-grapheme = { path = "../umsh-grapheme" }
umsh-emoji = { path = "../umsh-emoji" }
umsh-sound = { path = "../umsh-sound" }

[dev-dependencies]
# The tests drive the fixture's chats.
umsh-ux-communicator = { path = ".", features = ["fixture"] }

[build-dependencies]
swash = "0.2.7"
