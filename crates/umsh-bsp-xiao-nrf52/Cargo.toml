[package]
name = "umsh-bsp-xiao-nrf52"
description = "Board support for the Seeed XIAO nRF52840 + Wio-SX1262 Kit (nRF52840 + SX1262)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Board-level BSP for the Seeed Studio XIAO nRF52840 & Wio-SX1262 Kit for
# Meshtastic (SKU 102010710). Composes umsh-bsp-nrf52840 (chip plumbing)
# with this board's pinout.
#
# The fifth nRF52840 + SX1262 board, and the closest relative of the
# SenseCAP Solar Node: both are XIAO-pinout carriers around the same Wio
# SX1262 module, so the entire radio path and the battery-sense topology
# are shared pin-for-pin. The Platform bundle is a verbatim copy.
#
# What actually differs from the Solar Node, and therefore what this
# crate exists to hold:
#
#   * one common-anode RGB LED, ACTIVE LOW (P0.26/P0.06/P0.30) — the
#     Solar Node's two discrete LEDs are active high
#   * a BQ25100 charger with a firmware-visible status pin and a
#     charge-current select, where the Solar Node's CN3165 is autonomous
#   * the battery divider is UNGATED: P0.14 is held LOW at all times
#     (see the power module — this is a hardware rule, not a policy)
#   * no buttons at all as shipped, so no gesture UX and no GPIO wake
#
# In scope:
#   * USB-CDC over the nRF native USB peripheral (chip BSP)
#   * battery measurement (SAADC AIN7/P0.31, ungated 1M/510k divider)
#   * BQ25100 charge status (P0.17) + charge-current select (P0.13)
#   * SX1262 LoRa radio + external RXEN (P0.05)
#   * headless System OFF teardown (no button wake source exists)
#
# Out of scope for now:
#   * L76K GNSS UART (P1.11/P1.12) — the module is a separate purchase
#   * QSPI external flash deep power-down (P25Q16H) — pins reserved, NV
#     stays on internal NVMC
#   * LPCOMP low-battery recovery wake
#   * the retrofitted-K1 user button on P0.02 (see lib.rs)

[features]
default = []

[dependencies]
umsh-bsp-nrf52840 = { path = "../umsh-bsp-nrf52840", default-features = false }
umsh-hal          = { path = "../umsh-hal", default-features = false }

# Used by the `Platform` type bundle.
umsh-mac    = { path = "../umsh-mac", default-features = false }
umsh-crypto = { path = "../umsh-crypto", default-features = false, features = ["software-crypto"] }

[target.'cfg(target_os = "none")'.dependencies]
umsh-radio-loraphy = { path = "../umsh-radio-loraphy", default-features = false }
umsh-ux-tracker   = { path = "../umsh-ux-tracker", default-features = false }
embassy-nrf = { version = "0.11", default-features = false, features = ["nrf52840", "time-driver-rtc1", "gpiote", "rt"] }
embassy-time      = { version = "0.5", default-features = false }
embassy-sync = { version = "0.8", default-features = false }
embassy-futures   = { version = "0.1", default-features = false }
cortex-m          = { version = "0.7" }
