[package]
name = "umsh-bsp-techo"
description = "Board support for the LilyGO T-Echo (nRF52840)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Board-level BSP for the LilyGO T-Echo. Composes umsh-bsp-nrf52840
# with T-Echo pinout and on-board peripherals.
#
# Initial scope is intentionally minimal — only what is needed for the
# bringup firmware. Future expansion
# is welcome but not on the immediate path.
#
# In scope for bringup:
#   * peripheral-power-enable (P0.12)
#   * USB-CDC over the nRF native USB peripheral
#   * blue LED (P0.14) for heartbeat
#   * e-paper SPI bus + control pins (SSD1681)
#
# Out of scope for bringup (planned but not yet):
#   * SX1262 LoRa radio
#   * Quectel L76K GNSS UART
#   * I²C peripherals (PCF8563 RTC, BME280)
#   * QSPI external flash
#   * Buttons (user, touch, reset)
#   * Plus-only back-panel peripherals (DRV2605, BHI260, buzzer)
#
# See docs/hardware/lilygo-techo-hardware.md.

[features]
default = ["display", "platform", "power", "battery"]
display = ["dep:embassy-nrf", "dep:embassy-time", "dep:embedded-graphics"]
platform = [
    "dep:embassy-sync",
    "dep:embassy-time",
    "dep:umsh-crypto",
    "dep:umsh-mac",
    "dep:umsh-radio-loraphy",
]
power = ["dep:cortex-m", "dep:embassy-sync"]
# SAADC battery monitor on AIN2/P0.04. Lives in `power` because its
# protective low-battery cutoff fires that module's SHUTDOWN_SIGNAL.
battery = [
    "power",
    "dep:embassy-futures",
    "dep:embassy-nrf",
    "dep:embassy-time",
    "dep:umsh-ux-tracker",
]

[dependencies]
umsh-bsp-nrf52840 = { path = "../umsh-bsp-nrf52840", default-features = false }
umsh-hal          = { path = "../umsh-hal", default-features = false }

# Used by the `Platform` type bundle.
umsh-mac    = { path = "../umsh-mac", default-features = false, optional = true }
umsh-crypto = { path = "../umsh-crypto", default-features = false, features = ["software-crypto"], optional = true }

[target.'cfg(target_os = "none")'.dependencies]
umsh-radio-loraphy = { path = "../umsh-radio-loraphy", default-features = false, optional = true }
umsh-ux-tracker   = { path = "../umsh-ux-tracker", default-features = false, optional = true }
embassy-time      = { version = "0.5", default-features = false, optional = true }
embassy-sync = { version = "0.8", default-features = false, optional = true }
embassy-futures   = { version = "0.1", default-features = false, optional = true }
embassy-nrf = { version = "0.11", default-features = false, features = ["nrf52840", "time-driver-rtc1", "gpiote", "rt"], optional = true }
embedded-graphics = { version = "0.8", default-features = false, optional = true }
cortex-m          = { version = "0.7", optional = true }
