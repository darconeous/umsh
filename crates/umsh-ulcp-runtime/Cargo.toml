[package]
name = "umsh-ulcp-runtime"
description = "Board-agnostic ULCP device runtime shared across firmware targets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The board-agnostic slice of the ULCP device — pure protocol/session/channel
# plumbing with no board HAL. Consumed by both the nRF52840 and ESP32-S3
# ULCP firmwares so there is exactly one copy of this logic.
#
# Hard rule: NO board HAL here (no embassy-nrf, no esp-hal, no BSP). Only
# HAL-agnostic primitives — embassy-sync/futures (generic over RawMutex),
# heapless, and the pure protocol crates.

[features]
# `ble_security`, `transport_policy` and `log` are always compiled; they
# need nothing beyond `embassy-sync`, which every consumer pulls anyway.
# The heavier modules are gated so lightweight consumers — e.g. a BLE-only
# spike, or host tooling — pull only what they use instead of dragging in
# the radio stack or the journal store.
default = ["radio", "counters", "driver"]
# The radio multiplexer, over `umsh-radio-loraphy`'s `Channels`. It is
# also where a device tallies what its antenna did, so it needs the stats
# ledger (`umsh-ulcp`) and enough of the wire format (`umsh-core`) to tell
# an UMSH frame from somebody else's. Both are pure protocol crates — no
# board HAL crosses this line.
radio = [
    "dep:umsh-radio-loraphy",
    "dep:embassy-futures",
    "dep:umsh-hal",
    "dep:heapless",
    "dep:umsh-ulcp",
    "dep:umsh-core",
]
# The persisted frame-counter map, the two-page journal handles, and the
# device node's counter store — over `umsh-journal-store`.
counters = ["dep:umsh-journal-store", "dep:umsh-hal", "dep:heapless"]
# The board-agnostic session driver: the device run loop, effect dispatch,
# and frame staging, parameterized over the `DeviceEnv` board couplings.
# Also carries `duty_gate`, the shared duty-ledger radio decorator the
# device node wraps its mux bundle in (same `DutyLedger` dependency).
driver = [
    "radio",
    "dep:umsh-ulcp",
    "dep:umsh-ulcp-device",
    "dep:umsh-crypto",
    "dep:umsh-hal",
    "dep:umsh-journal-store",
    "dep:embassy-time",
    "dep:heapless",
]
# What a board does with a GNSS fix: the ULCP positioning properties,
# the wall clock, and the advertised identity's location. The receiver
# itself belongs to `umsh-gnss`; this is what a fix *means*, and both
# cargo workspaces share it.
gnss = [
    "driver",
    "dep:umsh-gnss",
    "dep:umsh-node",
    "umsh-hal/embassy",
]
# The device node: a full MAC/node stack for the device identity, sharing
# the radio through the mux. Generic over the board's counter store.
device-node = [
    "driver",
    "counters",
    "dep:umsh-core",
    "dep:umsh-mac",
    "dep:umsh-node",
    "dep:umsh-node-mgmt",
    "dep:umsh-sync",
    "umsh-hal/embassy",
    "dep:rand",
    "dep:rand_core",
    "dep:rand_chacha",
]
# `ThreadModeRawMutex` for the device node's statics. For boards on a
# single thread-mode executor whose BLE controller cannot tolerate the
# critical sections the portable default would take in the radio path.
node-thread-mode-mutex = []

[dependencies]
umsh-ulcp = { path = "../umsh-ulcp", optional = true }
umsh-ulcp-device = { path = "../umsh-ulcp-device", optional = true }
umsh-crypto = { path = "../umsh-crypto", default-features = false, features = ["software-crypto"], optional = true }
umsh-hal = { path = "../umsh-hal", default-features = false, optional = true }
umsh-radio-loraphy = { path = "../umsh-radio-loraphy", default-features = false, optional = true }
umsh-journal-store = { path = "../umsh-journal-store", optional = true }
embassy-futures = { version = "0.1", default-features = false, optional = true }
# Not optional: the debug-log seam every shared module writes through is
# a `blocking_mutex`, so this is a floor dependency rather than a feature.
embassy-sync = { version = "0.8", default-features = false }
embassy-time = { version = "0.5", default-features = false, optional = true }
heapless = { workspace = true, optional = true }
umsh-core = { path = "../umsh-core", default-features = false, optional = true }
umsh-mac = { path = "../umsh-mac", default-features = false, features = ["software-crypto"], optional = true }
umsh-node = { path = "../umsh-node", default-features = false, features = ["alloc", "software-crypto"], optional = true }
umsh-node-mgmt = { path = "../umsh-node-mgmt", default-features = false, optional = true }
umsh-gnss = { path = "../umsh-gnss", default-features = false, features = ["pump"], optional = true }
umsh-sync = { path = "../umsh-sync", default-features = false, optional = true }
rand = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
rand_chacha = { version = "0.3", default-features = false, optional = true }

[dev-dependencies]
# Used only by the modules' host-run unit tests.
heapless = { workspace = true }
# radio_mux's host-run unit tests: RadioError values and RxInfo/Snr.
lora-phy = { workspace = true }
umsh-hal = { path = "../umsh-hal", default-features = false }
umsh-ulcp = { path = "../umsh-ulcp" }
# gnss's host-run unit tests build a node identity profile, which is keyed
# by a `PublicKey`. Only the `device-node` feature needs this at build time.
umsh-core = { path = "../umsh-core", default-features = false }
# Host critical-section impl for embassy-sync under test; the target build
# gets its implementation from the firmware's controller stack.
critical-section = { version = "1", features = ["std"] }
# A stub time driver for the host tests, registered in `gnss`'s test
# module. `embassy-time`'s own `mock-driver` cannot be used: enabling a
# feature on `embassy-time` unifies across the whole workspace build and
# drags the executor's timer queue into crates that have no executor.
embassy-time-driver = { version = "0.2", default-features = false }
