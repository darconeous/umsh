[package]
name = "umsh-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://darconeous.github.io/umsh/docs/rust/umsh_crypto/"

[features]
default = ["std", "software-crypto"]
std = ["umsh-core/std"]
alloc = []
software-crypto = [
	"dep:aes",
	"dep:curve25519-dalek",
	"dep:ed25519-dalek",
	"dep:rand_core",
	"dep:sha2",
	"dep:x25519-dalek",
]
# SHA-2 as a rolled loop, for every user of `sha2` in the build (Ed25519's
# SHA-512 included). A fraction of the unrolled form's flash, and slower: by
# how much has not been measured on a board, but hashing is a small part of an
# Ed25519 operation beside the curve arithmetic. For flash-bound firmware
# only: on a host it also displaces the CPU's own SHA instructions.
compact-sha2 = ["sha2?/force-soft-compact"]

[dependencies]
heapless.workspace = true
aes = { workspace = true, optional = true }
curve25519-dalek = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }
zeroize.workspace = true
umsh-core = { path = "../umsh-core", default-features = false }

[dev-dependencies]
# Host-test cross-check that the construction is byte-for-byte RFC 5297
# AEAD_AES_SIV_CMAC_512. Not usable as the runtime implementation: it
# requires alloc and has no truncated-tag support.
aes-siv = "0.7"
