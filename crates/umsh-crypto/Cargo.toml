[package]
name = "umsh-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://darconeous.github.io/umsh/docs/rust/umsh_crypto/"

[features]
default = ["std", "software-crypto"]
std = ["umsh-core/std"]
alloc = []
software-crypto = [
	"dep:aes",
	"dep:curve25519-dalek",
	"dep:ed25519-dalek",
	"dep:rand_core",
	"dep:sha2",
	"dep:x25519-dalek",
]

[dependencies]
heapless.workspace = true
aes = { workspace = true, optional = true }
curve25519-dalek = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }
zeroize.workspace = true
umsh-core = { path = "../umsh-core", default-features = false }

[dev-dependencies]
# Host-test cross-check that the construction is byte-for-byte RFC 5297
# AEAD_AES_SIV_CMAC_512. Not usable as the runtime implementation: it
# requires alloc and has no truncated-tag support.
aes-siv = "0.7"
