[package]
name = "umsh-mobile-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Stable, value-oriented mobile facade for UMSH applications"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
umsh-core = { path = "../umsh-core" }
umsh-crypto = { path = "../umsh-crypto" }
umsh-hal = { path = "../umsh-hal" }
umsh-ulcp = { path = "../umsh-ulcp" }
umsh-uri = { path = "../umsh-uri" }
umsh-mac = { path = "../umsh-mac", features = ["std", "software-crypto"] }
umsh-node = { path = "../umsh-node", features = ["std", "software-crypto"] }
# Managing another node over the mesh: the phone drives the administrator
# half of the binding from its own worker.
umsh-node-mgmt = { path = "../umsh-node-mgmt" }
umsh-regiondb = { path = "../umsh-regiondb" }
umsh-sync = { path = "../umsh-sync" }
umsh-text = { path = "../umsh-text" }
embedded-hal-async.workspace = true
lwuri.workspace = true
rand = { workspace = true, features = ["std", "thread_rng", "sys_rng"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uniffi = "=0.32.0"
zeroize.workspace = true

[dev-dependencies]
tempfile = "3"
# test-util enables tokio's paused/virtual time for deterministic timer tests.
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "test-util"] }
