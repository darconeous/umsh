[package]
name = "umsh-mobile-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Stable, value-oriented mobile facade for UMSH applications"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
umsh-core = { path = "../umsh-core" }
umsh-crypto = { path = "../umsh-crypto" }
umsh-grapheme = { path = "../umsh-grapheme" }
umsh-hal = { path = "../umsh-hal" }
umsh-ulcp = { path = "../umsh-ulcp" }
umsh-uri = { path = "../umsh-uri" }
umsh-mac = { path = "../umsh-mac", features = ["std", "software-crypto"] }
umsh-node = { path = "../umsh-node", features = ["std", "software-crypto"] }
# Managing another node over the mesh: the phone drives the administrator
# half of the binding from its own worker.
umsh-node-mgmt = { path = "../umsh-node-mgmt" }
umsh-regiondb = { path = "../umsh-regiondb" }
umsh-sync = { path = "../umsh-sync" }
umsh-text = { path = "../umsh-text" }
# The LAN virtual radio: the production device session on the LAN bearer.
umsh-lan-bearer = { path = "../umsh-lan-bearer", features = ["tokio"] }
umsh-ulcp-device = { path = "../umsh-ulcp-device" }
umsh-ulcp-simdev = { path = "../umsh-ulcp-simdev", features = ["lan"] }
embedded-hal-async.workspace = true
# The app core's schedules read a clock that keeps counting while the phone
# sleeps, which `std` does not offer.
libc = "0.2"
lwuri.workspace = true
# The core logs through the `log` facade; the platform installs the logger.
# `kv` carries the private values as fields of their own.
log = { version = "0.4.29", features = ["kv"] }
rand = { workspace = true, features = ["std", "thread_rng", "sys_rng"] }
# The application store. Exactly the version `umsh-regiondb` uses:
# `libsqlite3-sys` declares `links = "sqlite3"`, so the graph holds one.
rusqlite = { version = "0.32", default-features = false }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
uniffi = "=0.32.0"
zeroize.workspace = true

# The NDK exposes no SQLite to apps, so Android compiles it in. iOS links the
# system library. `bundled-sqlite` turns on `rusqlite/bundled`, which covers
# the application store as well, since both share the one `rusqlite`.
[target.'cfg(target_os = "android")'.dependencies]
umsh-regiondb = { path = "../umsh-regiondb", features = ["bundled-sqlite"] }

[dev-dependencies]
tempfile = "3"
# test-util enables tokio's paused/virtual time for deterministic timer tests.
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "test-util"] }
