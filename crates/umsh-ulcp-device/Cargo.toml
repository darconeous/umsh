[package]
name = "umsh-ulcp-device"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Device-side session engine for the UMSH Local Control Protocol (ULCP)"

[features]
default = ["software-crypto"]
# Checks the frame signatures that decide an `EMERGENCY` message's receipt
# cue. Without it no signature verifies, so such a message never cues.
software-crypto = ["umsh-crypto/software-crypto"]
bridge-client = ["dep:ed25519-dalek"]
wifi = []
# Node messaging (`CAP_NODE_MSG`): a link sends and receives UMSH payloads
# through the device's own node.
node-msg = []
# A local link on a UART without hardware flow control: the window its
# reader paces the device with (`PROP_UART_WINDOW`), and, for an
# application wired to the device's own interface, a session the device
# can end. Every other build leaves it out.
uart-link = []
# A device with chats of its own, and a store to keep its peers in, holds
# more of them.
communicator = []
# A directional control of the device's own, such as a trackball
# (`PROP_DIRECTIONS_ENABLED`).
directional = []
# A screen of the device's own (`PROP_DISPLAY_BRIGHTNESS`,
# `PROP_DISPLAY_TIMEOUT`).
display = []
# A keyboard of the device's own, and the interface it is set up through
# (`PROP_KEYBOARD_LIGHT`, `PROP_KEYBOARD_AIDS`, `PROP_SETUP_COMPLETE`).
keyboard = []
# A sounder the device plays optional sounds on (`PROP_SOUND_ENABLED`,
# `PROP_SOUND_VOLUME`).
sound = []

[dependencies]
ed25519-dalek = { workspace = true, optional = true }
umsh-ulcp = { path = "../umsh-ulcp" }
umsh-core = { path = "../umsh-core", default-features = false, features = ["region-codec"] }
umsh-crypto = { path = "../umsh-crypto", default-features = false }
umsh-hal = { path = "../umsh-hal", default-features = false }
umsh-text = { path = "../umsh-text", default-features = false }
embassy-sync = { version = "0.8", default-features = false }
heapless.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
umsh-crypto = { path = "../umsh-crypto", default-features = false, features = [
	"software-crypto",
] }
# Host implementation of critical-section for the DutyLedger's blocking
# mutex in tests; firmware images provide theirs via nrf-mpsl.
critical-section = { version = "1", features = ["std"] }
