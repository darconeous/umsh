[package]
name = "umsh-ulcp-device"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Device-side session engine for the UMSH Local Control Protocol (ULCP)"

[features]
default = ["software-crypto"]
# Checks the frame signatures that decide an `EMERGENCY` message's receipt
# cue. Without it no signature verifies, so such a message never cues.
software-crypto = ["umsh-crypto/software-crypto"]
bridge-client = ["dep:ed25519-dalek"]
wifi = []
# A device with chats of its own, and a store to keep its peers in, holds
# more of them.
communicator = []

[dependencies]
ed25519-dalek = { workspace = true, optional = true }
umsh-ulcp = { path = "../umsh-ulcp" }
umsh-core = { path = "../umsh-core", default-features = false, features = ["region-codec"] }
umsh-crypto = { path = "../umsh-crypto", default-features = false }
umsh-hal = { path = "../umsh-hal", default-features = false }
umsh-text = { path = "../umsh-text", default-features = false }
embassy-sync = { version = "0.8", default-features = false }
heapless.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
umsh-crypto = { path = "../umsh-crypto", default-features = false, features = [
	"software-crypto",
] }
# Host implementation of critical-section for the DutyLedger's blocking
# mutex in tests; firmware images provide theirs via nrf-mpsl.
critical-section = { version = "1", features = ["std"] }
