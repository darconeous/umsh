# Metropolitan IATA regions.
#
# A metro code is a containment region: it applies inside its polygon and
# nowhere else. IATA publishes no boundaries for these codes, so every
# geometry here is a UMSH routing definition. The current polygons are all
# generated circular placeholders — good enough for "am I in the Tokyo area",
# sized generously, and individually replaceable with reviewed boundaries by
# editing the file a record points at.
#
# Metro regions are default-eligible and rank first: inside a metro polygon
# the metro code is the suggested packet default, above the commercial
# airport. A metro-tagged flood covers the whole area, which is the point —
# the tag matches how people name where they are.
version: 1

metros:
  - id: iata-metro:BAK
    iata: BAK
    name: Baku metropolitan area
    geometry: geometry/BAK.geojson
    expansion_m: 0
    source:
      name: Generated placeholder
      notes: >
        Geodesic disk of 45 km about 40.395278, 49.882222 (Azerbaijan);
        center from the citycodes seed list.
    interpretation: >
      A circular placeholder covering the commonly understood Baku metropolitan area, sized by
      eye rather than by survey. This is a UMSH routing definition, not an
      official boundary published by IATA or anyone else. Replace this file
      with a reviewed polygon whenever someone cares about the edge.
    confidence: low
