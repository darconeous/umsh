# Manual commercial-airport classification.
#
# The candidate list is bootstrapped from OurAirports' scheduled_service flag,
# which answers "does some scheduled flight exist" and not the question this
# layer asks — whether a person nearby would call this their airport. Entries
# here have the final say in both directions, and each carries a reason so the
# next reviewer knows what was decided rather than just what.
version: 1

overrides:
  SQL:
    commercial: false
    reason: >
      General-aviation reliever airport. Upstream marks it
      scheduled_service=yes, but it is not a scheduled passenger gateway, and
      no one in San Carlos would name it as their airport.
    evidence:
      - "https://www.smcgov.org/publicworks/san-carlos-airport"

  TEB:
    commercial: false
    reason: >
      Teterboro is a general-aviation reliever for corporate and charter
      traffic, with no scheduled passenger service anyone books. Upstream
      marks it scheduled_service=yes, which put it in the commercial layer
      competing with LaGuardia for northern Manhattan — the San Carlos case
      again, in the densest airport cluster in the country.
    evidence:
      - "https://www.panynj.gov/airports/en/teterboro.html"

  MFR:
    commercial: true
    reason: >
      Regional scheduled passenger airport for the Rogue Valley. Affirmed here
      as the standing positive example, so the override mechanism is exercised
      in both directions even when upstream already agrees.

  # Reviewed sweep: candidates within 30 km of a large-airport candidate,
  # where a general-aviation field wrongly marked scheduled_service takes
  # routing territory from the gateway everyone actually names. Airports
  # further out were left alone — out there a small field may genuinely be
  # the airport its area means.

  BED:
    commercial: false
    reason: >
      Hanscom Field is Boston's corporate and general-aviation reliever.
      No scheduled passenger service; Logan is what someone in Bedford
      names.

  BFI:
    commercial: false
    reason: >
      Boeing Field is King County's general-aviation, cargo, and Boeing
      test field. Seattle-Tacoma is the passenger gateway.

  CAT:
    commercial: false
    reason: >
      Cascais is a business-aviation and flight-training field outside
      Lisbon, not a scheduled passenger gateway.

  HHR:
    commercial: false
    reason: >
      Hawthorne Municipal is a corporate and general-aviation reliever
      seven kilometers from Los Angeles International.

  ILS:
    commercial: false
    reason: >
      Ilopango is a military and general-aviation field; San Salvador's
      passenger gateway is Comalapa.

  KTP:
    commercial: false
    reason: >
      Tinson Pen is Kingston's in-city general-aviation strip. Norman
      Manley is the airport Kingston means.

  LCK:
    commercial: false
    reason: >
      Rickenbacker is a cargo and charter field. Columbus's scheduled
      passenger gateway is John Glenn.

  LUK:
    commercial: false
    reason: >
      Lunken Field is Cincinnati's municipal general-aviation and
      corporate field.

  MEB:
    commercial: false
    reason: >
      Essendon Fields is Melbourne's corporate and general-aviation
      reliever.

  MRI:
    commercial: false
    reason: >
      Merrill Field is Anchorage's general-aviation field, one of the
      busiest in the country by movements and not a passenger gateway.

  NPT:
    commercial: false
    reason: >
      Newport State is a general-aviation field; Providence is Rhode
