  OKY:
    commercial: false
    reason: >
      Oakey is an Army Aviation Centre. Military fields are not
      passenger gateways whatever the schedule flag says.

  OPF:
    commercial: false
    reason: >
      Opa Locka Executive is Miami's corporate reliever.

  PDK:
    commercial: false
    reason: >
      DeKalb Peachtree is Atlanta's corporate and general-aviation
      reliever.

  PKR:
    commercial: false
    reason: >
      Pokhara's old domestic field, superseded by the adjacent Pokhara
