# Compilation policy for the UMSH region database.
#
# Every value here that can change a lookup result is folded into the build
# metadata and the database content hash, so a policy edit is as visible in a
# release diff as a boundary edit. Nothing in this file is a protocol constant:
# the radio never sees any of it, and the expansion distances in particular are
# meant to be re-tuned after looking at the map.
format_version: 1

distance:
  # Distances, radius caps, and buffers are geodesic on the WGS84 ellipsoid
  # (pyproj.Geod). Voronoi topology is computed on the unit sphere; the
  # difference is far below the meter-scale tolerances used here, but the model
  # is recorded so a rebuild is reproducible.
  model: WGS84

geometry:
  # Maximum deviation a densified great-circle arc may have from the true arc,
  # applied to the Voronoi bisector edges — the borders that decide which
  # generated region a position is in.
  curve_error_m: 100
  # Tolerance of the generated layers' radius-cap circles. The cap is where a
  # region fades out at maximum distance from its site, not a border anyone
  # contests, so it is deliberately much looser than the bisectors.
  cap_error_m: 1000
  # How far a country's or state's water extends from its charted land, in
  # meters. The administrative layers are land buffered seaward by this
  # reach — a country clipped to its EEZ, a US state clipped to its country —
  # rather than the full 200-nautical-mile jurisdiction, which made a boat in
  # the middle of the Pacific nominally American. 100 km matches how far the
  # IATA layers project offshore, so no water has an airport region but no
  # country, and it closes the channels between a state's islands and its
  # mainland. Consumed at update time: changing it means `make regions-fetch`
  # (once, for the vendor files) and `make regions-update`.
  maritime_reach_m: 100000
  # How coarsely the administrative borders are drawn, in meters. Routing
  # does not care which side of a Mississippi meander a repeater sits on,
  # and the detail is most of what the country and state layers cost. Both
  # layers are drawn together, after the maritime reach, so that a border
  # two regions share moves once rather than once per side. Consumed at
  # update time, like maritime_reach_m.
  #
  # This is a ceiling, not a uniform setting. Each border is smoothed by
  # what its smaller side can afford — five percent of that region's
  # equivalent radius — so a long border between two large states loses
  # its meanders while Monaco's does not move. Corners that a boundary is
  # defined to turn at, like the Oklahoma panhandle's, are held in place
  # regardless: a moving average cannot tell a right angle from a meander
  # and rounding one off is as wrong as leaving the other ragged.
  #
  # Raising it costs shape at the small end. The update report names
  # whichever region a change moves most, and
  # tools/regiondb-build/tests/test_boundary_quality.py fails on the
  # defect classes this has produced before.
  border_simplify_m: 15000
  # Topology-preserving simplification, per layer. Administrative coastlines
  # carry far more detail than routing needs; hand-authored local regions are
  # already drawn at the scale they mean. Country tolerance is the main size
  # The committed country extract is already distilled to one kilometer —
  # jurisdiction edges are legal constructs and 200-nautical-mile arcs, and
  # nothing about "whose jurisdiction is this" needs finer. Set a value here
  # only to coarsen further.
  country_simplify_m: 0
  state_simplify_m: 50
  metro_simplify_m: 25
  custom_simplify_m: 0

lookup_cache:
  # Adaptive Morton-range cache over the effective geometry. Depth 16 gives
  # roughly 600 m equatorial cells; boundary cells fall back to exact
  # point-in-polygon, so depth bounds cache size, never accuracy.
  enabled: false
  max_depth: 16

layers:
  commercial_airport:
    enabled: true
    max_radius_m: 100000
    # Tuned down from an initial 10 km after looking at the Bay Area, where
    # that margin offered a San Carlos repeater three commercial airports.
    # Two kilometers is enough to keep a repeater sitting on a cell border
    # honest about both sides without spilling regions across whole towns.
    expansion_m: 2000
    exclusive_core: true
    order: 100
    default_eligible: true

  positioned_iata:
    enabled: true
    max_radius_m: 100000
    expansion_m: 2000
    exclusive_core: true
    order: 200
    default_eligible: true

  metro:
    enabled: true
    expansion_m: 0
    exclusive_core: false
    order: 300
    default_eligible: true

  country:
    enabled: true
    expansion_m: 0
    exclusive_core: true
    order: 400
    default_eligible: false

  us_state:
    enabled: true
    expansion_m: 0
    exclusive_core: true
    order: 500
    default_eligible: false

  custom:
    enabled: true
    expansion_m: 0
    exclusive_core: false
    order: 600
    default_eligible: false

default_region:
  # Ordered preference for the suggested packet default region. Metro regions
  # rank first where one exists: inside the Tokyo area the tag people mean is
  # TYO, and the broader flood that follows is the deliberate cost of that.
  # Country and state regions are deliberately absent: they are large enough
  # that using one as a flood tag would broaden scope far past what the
  # operator intends.
  preference:
    - metro_core
    - commercial_airport_core
    - commercial_airport_expanded
    - positioned_iata_core
    - positioned_iata_expanded

us_state:
  # The 50 states plus the District of Columbia. Territories are excluded from
  # V1: several have no USPS-style two-letter code that reads as a region to
  # anyone living there, and the ones that do would need a policy decision
  # about how they interact with the country layer.
  include_territories: false

size:
  # A build over this size warns. It fails only past the hard limit, so that
  # measuring a large candidate release is possible without editing policy.
  warn_bytes: 10485760
  fail_bytes: 33554432
