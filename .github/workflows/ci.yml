name: CI

# Tiering rationale: the "fast" job covers the bulk of
# protocol/crypto/wire-format regressions in about a minute on stock Ubuntu.
# The nRF52840 firmware job is release-only because dev builds overflow flash
# on these boards (see CLAUDE.md) — it's also the only thing that would have
# caught a flash-budget regression before it shipped. The Apple job runs on
# every push/PR since this is a public repo (macOS runner minutes are free
# here); ESP32 is pushed to main-only / manual-dispatch since it's the least
# load-bearing target right now (Heltec V2 parked, only V3 active) and needs
# a heavier toolchain bring-up.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fmt, test, clippy, docs, dissector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # umsh-bridge's default `ble-radio` feature reaches BlueZ over D-Bus
      # (btleplug → libdbus-sys), which needs the C library's dev package at
      # build time. macOS runners need nothing — CoreBluetooth is native.
      - name: Install libdbus (umsh-bridge BLE)
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      # The root manifest is virtual, so this walks every workspace member
      # (including firmware/*), not just default-members.
      - name: cargo fmt --check
        run: cargo fmt --check

      # firmware-esp32 is a separate workspace and is invisible to the check
      # above. `+stable` because its rust-toolchain.toml pins the `esp`
      # channel, which this job doesn't install — stable rustfmt produces
      # identical output on that tree.
      - name: cargo fmt --check (firmware-esp32)
        run: cd firmware-esp32 && cargo +stable fmt --all --check

      # NOTE: plain `cargo test`, not `--workspace` — the latter drags in
      # firmware/* crates that aren't meant to build on host and currently
      # fail (umsh-ulcp-runtime needs an embedded-target embassy feature).
      # default-members in Cargo.toml is what excludes them.
      # --locked here (and not in the firmware/ESP32 jobs, which go through
      # the Makefile) is enough to catch a Cargo.toml change that forgot to
      # update the committed lockfile — they all share the root Cargo.lock.
      - name: cargo test
        run: cargo test --locked

      # umsh-ulcp-runtime's heavier modules are behind features no host
      # crate turns on, so their unit tests are invisible to the run above
      # — `gnss` carries the fix-folding rules and `device-node` the
      # announcement scatter, both host-testable and both exactly the part
      # worth catching before it reaches a board.
      - name: cargo test (umsh-ulcp-runtime gnss, device-node)
        run: cargo test --locked -p umsh-ulcp-runtime --features gnss,device-node

      # Report-only for now: there are pre-existing clippy warnings in the
      # tree (collapsible-if, needless-borrow, too-many-arguments). Flip to
      # `cargo clippy -- -D warnings` once those are cleaned up.
      - name: cargo clippy (report only)
        run: cargo clippy --all-targets
        continue-on-error: true

      - name: Install mdbook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"

      - name: mdbook build
        run: mdbook build docs/protocol/

      # run_tests.lua needs Lua 5.3+ and stubs the Wireshark API, so no
      # Wireshark install is required. The crypto section self-skips when
      # luagcrypt is absent — which is how the hard-coded golden vectors once
      # went stale unnoticed — so build luagcrypt (pinned) against the distro
      # libgcrypt and fail the step if anything still reports SKIP.
      - name: Wireshark dissector unit tests
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 liblua5.4-dev libgcrypt20-dev
          git clone https://github.com/Lekensteyn/luagcrypt /tmp/luagcrypt
          git -C /tmp/luagcrypt checkout 5763e94b751e6ff0dcf20e328c299d49eb8fcbce
          make -C /tmp/luagcrypt LUA_VER=5.4 LUA_DIR=/usr
          set -o pipefail
          LUA_CPATH="/tmp/luagcrypt/?.so;;" lua5.4 dissectors/tests/run_tests.lua \
            | tee /tmp/dissector-tests.log
          grep -q "luagcrypt AVAILABLE" /tmp/dissector-tests.log
          if grep -q "SKIP" /tmp/dissector-tests.log; then
            echo "::error::dissector test assertions were skipped"
            exit 1
          fi

  firmware-nrf52840:
    name: firmware (nRF52840) / ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `make_target` is the Makefile target, so CI reuses the exact same
          # build recipe developers use locally.
          - board: techo
            make_target: build-techo
          - board: techo-console
            make_target: build-techo-console
          - board: t1000e
            make_target: build-t1000e
          - board: t1000e-console
            make_target: build-t1000e-console
          - board: sensecap-solar
            make_target: build-sensecap-solar
          - board: sensecap-solar-console
            make_target: build-sensecap-solar-console
          - board: wio-tracker-l1
            make_target: build-wio-tracker-l1
          - board: wio-tracker-l1-console
            make_target: build-wio-tracker-l1-console
          # No console harness for this board — new boards ship the device
          # image only.
          - board: xiao-nrf52
            make_target: build-xiao-nrf52
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      # The firmware crates are members of the ROOT workspace (no per-firmware
      # Cargo.lock, and the Makefile's TARGET_DIR is root-relative), so the
      # cache tracks the root workspace, not firmware/<board>. Only the
      # working directory differs per board — that's what picks up the
      # per-firmware .cargo/config.toml.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.board }}

      # nrf-sdc-sys / nrf-mpsl-sys run bindgen at build time (cross-targeting
      # ARM via clang args), so libclang must be present. It's normally in the
      # runner image already; installing it explicitly removes a whole class
      # of confusing build.rs failures.
      - name: Install libclang (bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      # nRF52840 firmware only links in --release (dev overflows flash).
      - name: Build (release)
        run: make ${{ matrix.make_target }}

  apple:
    name: iOS / mobile-core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      - name: Build mobile-core xcframework + Swift bindings
        run: ./scripts/ios/build-mobile-core.sh

      # GitHub rotates the simulators in its macOS images, so pinning a device
      # name is a standing breakage: the image this first ran on had no
      # "iPhone 16" at all (its oldest iPhone was 16e). Resolve a concrete
      # simulator UDID at run time instead — newest iOS runtime, any iPhone.
      - name: Select an iOS simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "SimRuntime.iOS-" not in runtime:
                  continue
              version = tuple(int(p) for p in runtime.split("iOS-")[1].split("-"))
              for device in devices:
                  if device["name"].startswith("iPhone"):
                      if best is None or version > best[0]:
                          best = (version, device["udid"], device["name"])
                      break
          if best is None:
              sys.exit("no available iPhone simulator found")
          print(best[1])
          print("selected:", best[2], best[0], file=sys.stderr)
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # The package pins .iOS(.v18), so `swift test` on the macOS host can't
      # run it — a simulator destination is required. xcodebuild derives the
      # UMSHMobileCore scheme from Package.swift (no checked-in .xcscheme).
      - name: Test UMSHMobileCore Swift package
        run: |
          cd packages/UMSHMobileCore
          xcodebuild test \
            -scheme UMSHMobileCore \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

      # No app-level XCTest target exists yet (UMSH.xcscheme's TestAction has
      # no Testables) — this is a build-only gate until one's added.
      - name: Build UMSH app (simulator)
        run: |
          xcodebuild build \
            -project apps/ios/UMSH.xcodeproj \
            -scheme UMSH \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  esp32:
    name: firmware (ESP32) / ${{ matrix.make_target }}
    runs-on: ubuntu-latest
    # Main-only / manual: heavier toolchain bring-up, and the least
    # load-bearing target right now (Heltec V2 is parked, only V3 is active).
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        make_target: [build-heltec-v3, build-heltec-v3-console]
    steps:
      - uses: actions/checkout@v4

      # espup resolves the "latest" Xtensa Rust release through the GitHub API,
      # which 403s from Actions runners when unauthenticated (shared runner IPs
      # are aggressively rate-limited). espup reads GITHUB_TOKEN and its docs
      # recommend setting it in CI. The action itself declares no token input,
      # so it goes in the step env. If the lookup is still flaky, pin the
      # `version:` input to skip the API call entirely.
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          ldproxy: false
          buildtargets: esp32s3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware-esp32

      - run: make ${{ matrix.make_target }}
