name: CI

# Tiering rationale: the "fast" job covers the bulk of
# protocol/crypto/wire-format regressions in about a minute on stock Ubuntu.
# The nRF52840 firmware job is release-only because dev builds overflow flash
# on these boards (see CLAUDE.md)—it's also the only thing that would have
# caught a flash-budget regression before it shipped. The Apple job runs on
# every push/PR since this is a public repo (macOS runner minutes are free
# here); ESP32 is pushed to main-only / manual-dispatch since it's the least
# load-bearing target right now and needs a heavier toolchain bring-up.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fmt, test, clippy, docs, dissector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # umsh-bridge's default `ble-radio` feature reaches BlueZ over D-Bus
      # (btleplug → libdbus-sys), which needs the C library's dev package at
      # build time. macOS runners need nothing—CoreBluetooth is native.
      - name: Install libdbus (umsh-bridge BLE)
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      # The root manifest is virtual, so this walks every workspace member
      # (including firmware/*), not just default-members.
      - name: cargo fmt --check
        run: cargo fmt --check

      # firmware-esp32 is a separate workspace and is invisible to the check
      # above. `+stable` because its rust-toolchain.toml pins the `esp`
      # channel, which this job doesn't install—stable rustfmt produces
      # identical output on that tree.
      - name: cargo fmt --check (firmware-esp32)
        run: cd firmware-esp32 && cargo +stable fmt --all --check

      # So is fuzz/, and for the same reason.
      - name: cargo fmt --check (fuzz)
        run: cd fuzz && cargo +stable fmt --all --check

      # The ESP32 device images are thin manifests over one set of sources,
      # each carrying its own copy of the feature table. A copy that drifts
      # only fails when its board is built, and the `esp32` job below does
      # not run on pull requests—this does.
      - name: ESP32 manifest feature tables
        run: python3 scripts/check_esp32_manifests.py

      # The T-Deck keyboard's logic against a model of the stock firmware.
      # It lives in the firmware-esp32 workspace, which `cargo test` above
      # does not see.
      - name: T-Deck keyboard tests
        run: make test-tdeck-keyboard

      # NOTE: plain `cargo test`, not `--workspace`—the latter drags in
      # firmware/* crates that aren't meant to build on host and currently
      # fail (umsh-ulcp-runtime needs an embedded-target embassy feature).
      # default-members in Cargo.toml is what excludes them.
      # --locked here (and not in the firmware/ESP32 jobs, which go through
      # the Makefile) is enough to catch a Cargo.toml change that forgot to
      # update the committed lockfile—they all share the root Cargo.lock.
      - name: cargo test
        run: cargo test --locked

      # umsh-ulcp-runtime's heavier modules are behind features no host
      # crate turns on, so their unit tests are invisible to the run above
      #—`gnss` carries the fix-folding rules and `device-node` the
      # announcement scatter, both host-testable and both exactly the part
      # worth catching before it reaches a board.
      - name: cargo test (umsh-ulcp-runtime gnss, device-node)
        run: cargo test --locked -p umsh-ulcp-runtime --features gnss,device-node

      # The device's own interface, by name: the run above leaves it out, and
      # the workspace run reaches it only through another crate's features.
      - name: cargo test (umsh-ulcp-runtime device-link)
        run: cargo test --locked -p umsh-ulcp-runtime --features gnss,device-node,device-link

      # The board features. The workspace build has the device session
      # serve all of them (the simulated device does), so the session is
      # also tested without them; and the communicator reads the trackball
      # and the sounder only with features no host crate turns on.
      - name: cargo test (umsh-ulcp-device without board features)
        run: cargo test --locked -p umsh-ulcp-device --lib
      - name: cargo test (board features)
        run: cargo test --locked -p umsh-ulcp-device -p umsh-ux-communicator -p umsh-communicator --features umsh-communicator/directional,umsh-communicator/sound

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # The same feature gap as the test run above.
      - name: cargo clippy (umsh-ulcp-runtime gnss, device-node)
        run: cargo clippy -p umsh-ulcp-runtime --all-targets --features gnss,device-node -- -D warnings

      - name: cargo clippy (umsh-ulcp-device without board features)
        run: cargo clippy -p umsh-ulcp-device --all-targets -- -D warnings
      - name: cargo clippy (board features)
        run: cargo clippy -p umsh-ulcp-device -p umsh-ux-communicator -p umsh-communicator --all-targets --features umsh-communicator/directional,umsh-communicator/sound -- -D warnings

      # `+stable` because the nightly fuzz/rust-toolchain.toml pins carries no
      # clippy component.
      - name: cargo clippy (fuzz)
        run: cd fuzz && cargo +stable clippy --all-targets -- -D warnings

      - name: Install mdbook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"

      - name: mdbook build
        run: mdbook build docs/protocol/

      # run_tests.lua needs Lua 5.3+ and stubs the Wireshark API, so no
      # Wireshark install is required. The crypto section self-skips when
      # luagcrypt is absent—which is how the hard-coded golden vectors once
      # went stale unnoticed—so build luagcrypt (pinned) against the distro
      # libgcrypt and fail the step if anything still reports SKIP.
      - name: Wireshark dissector unit tests
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 liblua5.4-dev libgcrypt20-dev
          git clone https://github.com/Lekensteyn/luagcrypt /tmp/luagcrypt
          git -C /tmp/luagcrypt checkout 5763e94b751e6ff0dcf20e328c299d49eb8fcbce
          make -C /tmp/luagcrypt LUA_VER=5.4 LUA_DIR=/usr
          set -o pipefail
          LUA_CPATH="/tmp/luagcrypt/?.so;;" lua5.4 dissectors/tests/run_tests.lua \
            | tee /tmp/dissector-tests.log
          grep -q "luagcrypt AVAILABLE" /tmp/dissector-tests.log
          if grep -q "SKIP" /tmp/dissector-tests.log; then
            echo "::error::dissector test assertions were skipped"
            exit 1
          fi

  # The region database's Python compiler and its cross-implementation
  # conformance. Everything here runs on the committed tree: the fixture
  # database is a build output that lives in the repository, so CI checks that
  # it still matches its source rather than compiling a global database on
  # every push.
  # The wrappers build on the nightly fuzz/rust-toolchain.toml pins, so an API
  # change that breaks one fails here rather than in the night's fuzzing. No
  # fuzzing runs on a pull request: `cargo test` above already replays every
  # committed seed and regression, and fuzz.yml does the rest on a schedule.
  fuzz-build:
    name: fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned nightly
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: fuzz

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo +stable install cargo-fuzz --locked

      - name: cargo fuzz build
        run: make fuzz-build

  regions:
    name: region database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: tools/regiondb-build/uv.lock

      - name: Install builder dependencies
        run: cd tools/regiondb-build && uv sync --locked

      - name: ruff format --check
        run: cd tools/regiondb-build && uv run ruff format --check .

      - name: ruff check
        run: cd tools/regiondb-build && uv run ruff check .

      # Covers the Python port of the region-code derivation against a digest
      # of all 47,988 short codes generated from umsh-core, the geometry codec
      # against its golden vectors, and a rebuild of the fixture database whose
      # content hash must match the committed one.
      - name: pytest
        run: cd tools/regiondb-build && uv run pytest -q

      # Proves the compiled lookup cache agrees with an exhaustive scan of the
      # same geometry, densely around boundaries.
      - name: fixture validation
        run: make regions-check

      - name: Rust runtime and conformance
        run: cargo test --locked -p umsh-regiondb

      # The browser lookup engine, replaying the same fixtures. No browser
      # involved: what is under test is the lookup logic, and it is written to
      # be driven by any SQLite binding, so node's built-in one does. Booting
      # the actual page needs Chromium and is `make regions-map-check`.
      - name: Browser lookup conformance
        run: node --test "site/tests/regions/*.test.mjs"

  firmware-nrf52840:
    name: firmware (nRF52840) / ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `make_target` is the Makefile target, so CI reuses the exact same
          # build recipe developers use locally.
          - board: techo
            make_target: build-techo
          - board: t1000e
            make_target: build-t1000e
          - board: sensecap-solar
            make_target: build-sensecap-solar
          - board: wio-tracker-l1
            make_target: build-wio-tracker-l1
          - board: xiao-nrf52
            make_target: build-xiao-nrf52
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      # The firmware crates are members of the ROOT workspace (no per-firmware
      # Cargo.lock, and the Makefile's TARGET_DIR is root-relative), so the
      # cache tracks the root workspace, not firmware/<board>. Only the
      # working directory differs per board—that's what picks up the
      # per-firmware .cargo/config.toml.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.board }}

      # nrf-sdc-sys / nrf-mpsl-sys run bindgen at build time (cross-targeting
      # ARM via clang args), so libclang must be present. bindgen also asks a
      # `clang` executable, found separately, for its include paths and adds
      # them as -isystem. The runner image carries several LLVM versions, and
      # when that `clang` is not the libclang's version, two Clang resource
      # directories land on the path: the first stdint.h takes the shared
      # include guard and include_nexts the second, which the guard empties,
      # and uint32_t is never defined. Both come from one LLVM here.
      - name: Install libclang (bindgen)
        env:
          LLVM_VERSION: "21"
        run: |
          sudo apt-get update
          sudo apt-get install -y "libclang-$LLVM_VERSION-dev" "clang-$LLVM_VERSION"
          echo "LIBCLANG_PATH=/usr/lib/llvm-$LLVM_VERSION/lib" >> "$GITHUB_ENV"
          echo "CLANG_PATH=/usr/lib/llvm-$LLVM_VERSION/bin/clang" >> "$GITHUB_ENV"

      # nRF52840 firmware only links in --release (dev overflows flash).
      - name: Build (release)
        run: make ${{ matrix.make_target }}

  apple:
    name: iOS / mobile-core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      - name: Build mobile-core xcframework + Swift bindings
        run: ./scripts/ios/build-mobile-core.sh

      # The Swift bindings are committed; regenerating them must change
      # nothing, or the app builds against an interface the core no longer
      # exports.
      - name: Check the committed Swift bindings are current
        run: git diff --exit-code packages/UMSHMobileCore/Sources/UMSHMobileCore/UMSHMobileCore.swift

      - name: Test persistence and radio boundaries on the host
        run: |
          export CLANG_MODULE_CACHE_PATH="$RUNNER_TEMP/umsh-swift-module-cache"
          scripts/ios/verify-mobile-core-swift.sh
          scripts/ios/verify-ios-persistence.sh
          scripts/ios/verify-device-management.sh
          scripts/ios/verify-radio-accessories.sh
          scripts/ios/verify-radio-host-state.sh
          scripts/ios/verify-radio-recovery.sh

      # GitHub rotates the simulators in its macOS images, so pinning a device
      # name is a standing breakage: the image this first ran on had no
      # "iPhone 16" at all (its oldest iPhone was 16e). Resolve a concrete
      # simulator UDID at run time instead—newest iOS runtime, any iPhone.
      - name: Select an iOS simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "SimRuntime.iOS-" not in runtime:
                  continue
              version = tuple(int(p) for p in runtime.split("iOS-")[1].split("-"))
              for device in devices:
                  if device["name"].startswith("iPhone"):
                      if best is None or version > best[0]:
                          best = (version, device["udid"], device["name"])
                      break
          if best is None:
              sys.exit("no available iPhone simulator found")
          print(best[1])
          print("selected:", best[2], best[0], file=sys.stderr)
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # The package pins .iOS(.v18), so `swift test` on the macOS host can't
      # run it—a simulator destination is required. xcodebuild derives the
      # UMSHMobileCore scheme from Package.swift (no checked-in .xcscheme).
      - name: Test UMSHMobileCore Swift package
        run: |
          cd packages/UMSHMobileCore
          xcodebuild test \
            -scheme UMSHMobileCore \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Test UMSH application and UI
        run: |
          xcodebuild test \
            -project apps/ios/UMSH.xcodeproj \
            -scheme UMSH \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build UMSH app (device)
        run: |
          xcodebuild build \
            -project apps/ios/UMSH.xcodeproj \
            -scheme UMSH \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Export strings for translation
        run: scripts/ios/export-localizations.sh

  android:
    name: Android / mobile-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The image ships the Android SDK but not necessarily the pinned NDK,
      # and AGP fetches an NDK only for externalNativeBuild.
      - name: Install the pinned NDK
        run: |
          ndk=$(sed -n 's/^ndk = "\(.*\)"/\1/p' apps/android/gradle/libs.versions.toml)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" > /dev/null

      - name: Lint, unit tests, and debug build
        run: apps/android/gradlew -p apps/android lint testDebugUnitTest assembleDebug

      # Play refuses updates whose native code is not 16 KB page aligned:
      # every LOAD segment of every library, and each library's place in the
      # APK.
      - name: Check 16 KB alignment
        run: |
          apk=apps/android/app/build/outputs/apk/debug/app-debug.apk
          zipalign=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)zipalign
          "$zipalign" -c -P 16 -v 4 "$apk" > /dev/null
          ndk=$(sed -n 's/^ndk = "\(.*\)"/\1/p' apps/android/gradle/libs.versions.toml)
          readelf="$ANDROID_HOME/ndk/$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          libs=$(mktemp -d)
          unzip -q "$apk" 'lib/*' -d "$libs"
          status=0
          for so in "$libs"/lib/*/*.so; do
            if "$readelf" -lW "$so" | awk '$1 == "LOAD" && strtonum($NF) < 16384 { bad = 1 } END { exit bad }'; then
              echo "ok: ${so#$libs/}"
            else
              echo "::error::${so#$libs/} has a LOAD segment aligned below 16 KB"
              status=1
            fi
          done
          exit $status

  esp32:
    name: firmware (ESP32) / ${{ matrix.make_target }}
    runs-on: ubuntu-latest
    # Main-only / manual: heavier toolchain bring-up, and the least
    # load-bearing targets right now.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        make_target:
          [
            build-heltec-v3,
            build-heltec-v3-bridge,
            build-heltec-v2,
            build-tbeam-supreme,
            build-tlora-pager,
            build-xiao-esp32s3,
            build-tdeck,
            build-tdeck-keyboard,
          ]
    steps:
      - uses: actions/checkout@v4

      # espup resolves the "latest" Xtensa Rust release through the GitHub API,
      # which 403s from Actions runners when unauthenticated (shared runner IPs
      # are aggressively rate-limited). espup reads GITHUB_TOKEN and its docs
      # recommend setting it in CI. The action itself declares no token input,
      # so it goes in the step env. If the lookup is still flaky, pin the
      # `version:` input to skip the API call entirely.
      - uses: esp-rs/xtensa-toolchain@v1.7.0
        with:
          ldproxy: false
          buildtargets: esp32,esp32s3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware-esp32

      - run: make ${{ matrix.make_target }}

      # The crates Credits lists, against what the communicator images link.
      - if: matrix.make_target == 'build-tlora-pager'
        run: make crate-notices-check
