[package]
name = "firmware-heltec-v3"
description = "Heltec WiFi LoRa 32 V3 ULCP device firmware over UART0 and BLE GATT"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The full ULCP firmware on ESP32-S3 — the shared session driver from
# `umsh-ulcp-runtime` behind this board's transports (HDLC on
# UART0/CP2102, UlcpService GATT on the esp-radio controller),
# with the SX1262 behind the radio mux and the on-board device node.

[features]
# Board identity. Exactly one is on; it selects the BSP module, the pin
# and peripheral wiring, the radio's power and band limits, and the
# static capacities the board's RAM budget allows. This block is kept
# identical across the ESP32 device boards — only `default` differs.
default = ["board-heltec-v3"]
board-heltec-v2 = ["chip-esp32", "radio-sx127x", "vext-gates-battery"]
board-heltec-v3 = ["chip-esp32s3", "radio-sx126x"]
board-tbeam-supreme = [
    "chip-esp32s3",
    "radio-sx126x",
    "pmic-axp2101",
    "display-sh1106",
    "wired-usb-serial-jtag",
    "gnss",
    "rtc-pcf8563",
]

# ─── Capability features (shared code shape, board-portable) ───
# Which Espressif part this is. Separate from the board features because
# it is silicon, not wiring: the classic ESP32 is dual-core and names its
# per-CPU reset reasons accordingly, has no super-watchdog, and carries
# roughly half the S3's data RAM. The esp-* dependency tables select the
# matching chip feature on each esp-hal family crate.
chip-esp32 = []
chip-esp32s3 = []
# SX127x family: no BUSY handshake, a single DIO line carries every IRQ,
# and the RF switch is driven by the radio's own RXTX output — so the
# interface variant takes one fewer pin than the SX126x's.
radio-sx127x = []
# SX126x family: BUSY handshake, DIO1 for IRQs, DIO2 drives the RF switch
# and DIO3 the TCXO supply.
radio-sx126x = []
# The `Vext` rail gates the battery divider as well as the panel, so the
# battery sampler and the display share one owned rail handle and a
# battery reading forces the rail up. Boards with an independent divider
# gate leave this off.
vext-gates-battery = []
# Power comes through an AXP2101 PMIC instead of MCU GPIOs: rails are
# brought up over I²C before any peripheral is probed, the battery is
# read from the PMIC's gauge (no SAADC divider), the charge LED belongs
# to the charger, and "off" is a PMIC power-off rather than deep sleep.
# Replaces Vext, the battery sampler, and the status LED wholesale.
pmic-axp2101 = []
# SH1106 panel (shared `umsh-display-sh1106` driver) instead of the
# ssd1306 crate: the I²C address is probed (0x3D first — 0x3C may be a
# magnetometer), and there is no reset GPIO — the panel's rail is its
# reset.
display-sh1106 = []
# The wired ULCP transport is the chip's native USB-Serial-JTAG port
# rather than UART0 behind an external USB-UART bridge. Writes are
# bounded: with no host attached the FIFO drains nowhere, and an unbound
# write would wedge the session.
wired-usb-serial-jtag = []
# On-board GNSS receiver on UART1, powered through the pump's rail/wake
# gate; positioning flows through `umsh-ulcp-runtime`'s gnss feature.
gnss = []
# PCF8563 wall-clock RTC: time is restored at boot (TimeSource::
# ExternalRtc) and written back on manual set and trusted GNSS time.
rtc-pcf8563 = []

# Mirror of the nRF firmware's ble-debug: multiplex driver/BLE diagnostics as
# ASCII lines onto the UART0 output stream (HDLC hosts resynchronize
# past them) and keep advertising open regardless of transport
# arbitration so the BLE path stays reachable while debugging.
ble-debug = ["trouble-host/security-debug"]

[[bin]]
name = "firmware-heltec-v3"
# The protocol, security, transport-arbitration, and BLE implementation
# live in the shared ESP32 tracker sources. Board differences are
# selected by the capability + `board-heltec-v3` features above.
path = "../esp32-tracker/src/main.rs"

[dependencies]
umsh-bsp-esp32 = { path = "../../crates/umsh-bsp-esp32", features = ["esp32s3", "panic-handler"] }
umsh-bsp-heltec-lora32-v3 = { path = "../../crates/umsh-bsp-heltec-lora32-v3" }
umsh-ulcp = { path = "../../../crates/umsh-ulcp", default-features = false }
umsh-ulcp-device = { path = "../../../crates/umsh-ulcp-device", default-features = false }
# Board-agnostic device runtime shared with the T-Echo/T-1000E images:
# session driver, radio mux, transport policy, pairing policy, counter
# map. Default features pull the radio and journal-store machinery.
umsh-ulcp-runtime = { path = "../../../crates/umsh-ulcp-runtime", features = ["device-node"] }
umsh-crypto = { path = "../../../crates/umsh-crypto", default-features = false, features = ["software-crypto"] }
umsh-hal = { path = "../../../crates/umsh-hal", default-features = false, features = ["embassy"] }
umsh-journal-store = { path = "../../../crates/umsh-journal-store" }
umsh-radio-loraphy = { path = "../../../crates/umsh-radio-loraphy", default-features = false }
umsh-ux-tracker = { path = "../../../crates/umsh-ux-tracker" }
umsh-ux-display-tracker = { path = "../../../crates/umsh-ux-display-tracker", features = ["screen"] }
# The device node: a full on-board MAC/node stack for the device
# identity (device_node.rs), sharing the radio through the mux.
umsh-core = { path = "../../../crates/umsh-core", default-features = false }
umsh-mac = { path = "../../../crates/umsh-mac", default-features = false, features = ["software-crypto"] }
umsh-node = { path = "../../../crates/umsh-node", default-features = false, features = ["alloc", "software-crypto"] }
umsh-sync = { path = "../../../crates/umsh-sync", default-features = false }

bt-hci = { version = "0.9", default-features = false }
# 0.8 matches the shared driver's FrameBuf and the journal payload types;
# the trouble 0.7 GATT server characteristics are built on 0.9.
heapless = { version = "0.8", default-features = false }
heapless09 = { package = "heapless", version = "0.9", default-features = false }
embassy-executor = { version = "0.10", default-features = false }
embassy-futures = { version = "0.1", default-features = false }
embassy-sync = { version = "0.8", default-features = false }
embassy-time = { version = "0.5", default-features = false }
embedded-graphics = { version = "0.8", default-features = false }
embedded-hal-bus = { version = "0.3", default-features = false, features = ["async"] }
# The wired transport's read/write traits, which both the UART and the
# USB-Serial-JTAG peripheral implement — one transport implementation
# whichever port a board wires.
embedded-io-async = { version = "0.7", default-features = false }
# Raw flash over the internal SPI NOR (journal backing). The chip feature
# and `embedded-storage` impl come from umsh-bsp-esp32's esp-storage
# dependency via feature unification.
esp-storage = { version = "0.9", default-features = false, features = ["critical-section", "embedded-storage"] }
# umsh-node / umsh-sync use `alloc`.
esp-alloc = { version = "0.10" }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32s3"] }
esp-hal = { version = "1.1", features = ["esp32s3", "unstable"] }
esp-println = { version = "0.17", features = ["esp32s3"] }
esp-radio = { version = "1.0.0-beta.0", features = ["esp32s3", "ble", "unstable"] }
esp-rtos = { version = "0.3", features = ["esp32s3", "embassy", "esp-radio", "esp-alloc"] }
# Resolves to ../../lora-rs via the workspace [patch].
lora-phy = { version = "3.0.2-alpha", default-features = false }
# Device-identity generation and the device node's CSPRNG: ChaCha20
# seeded from the RF-gated hardware TRNG at boot.
rand = { version = "0.10", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", default-features = false }
static_cell = "2"
trouble-host = { version = "0.7", default-features = false, features = ["derive", "peripheral", "gatt", "security", "default-packet-pool", "default-packet-pool-mtu-255"] }
