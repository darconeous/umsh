# Chip-agnostic workspace defaults. Each firmware crate selects its own
# target triple in a per-firmware `.cargo/config.toml` ([build] target,
# plus any chip-quirk env overrides—the Heltec V2's ancient-silicon
# revision floor lives there, not here). Per-directory configs only apply
# when cargo runs from inside the firmware directory, so build from there
# (the Makefile targets do); `-p` from the workspace root picks a wrong or
# missing target.
[target.xtensa-esp32-none-elf]
runner = "espflash flash --monitor"
rustflags = [
    "-C", "link-arg=-nostartfiles",
    "-C", "link-arg=-Wl,-Tlinkall.x",
]

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor"
rustflags = [
    "-C", "link-arg=-nostartfiles",
    "-C", "link-arg=-Wl,-Tlinkall.x",
]

# The T-Deck keyboard's ESP32-C3.
[target.riscv32imc-unknown-none-elf]
runner = "espflash flash --monitor"
rustflags = [
    "-C", "link-arg=-Tlinkall.x",
]

[env]
ESP_LOG = "info"

[unstable]
build-std = ["core", "alloc"]
# For `trim-paths` below. Set here rather than in the manifest, which
# stable Cargo (rustfmt's) must still parse.
trim-paths = true

# Panic locations name a file relative to its crate or the workspace, not
# by its absolute path: shorter strings in flash, and more of the persisted
# panic record left for the message. Debug info keeps absolute paths.
# Stable Cargo rejects this file because of it, so a stable build of a
# workspace crate (`make test-tdeck-keyboard`) runs from outside the tree.
[profile.release]
trim-paths = "macro"
