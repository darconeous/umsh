# Sibling workspace for Espressif (Xtensa) targets—classic ESP32 and
# ESP32-S3. Excluded from the
# root workspace because the Xtensa Rust fork (`espup`, channel = "esp")
# cannot coexist with the root `rust-toolchain.toml`, and esp-hal's embassy
# driver constraints must not enter the root Cargo.lock. Shared UMSH crates
# come in as path dependencies from ../crates.
#
# See docs/firmware-architecture.md.
[workspace]
members = [
    "crates/umsh-bsp-esp32",
    "crates/umsh-bsp-heltec-lora32-v2",
    "crates/umsh-bsp-heltec-lora32-v3",
    "crates/umsh-bsp-tbeam-supreme",
    "crates/umsh-bsp-tlora-pager",
    "firmware/heltec-v2",
    "firmware/heltec-v3-console",
    "firmware/heltec-v3",
    "firmware/tbeam-supreme",
    "firmware/tlora-pager",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/darconeous/umsh"

# Replicated from the root workspace manifest—[patch] tables do not cross
# workspace boundaries. The trouble-host rev must stay in lockstep with the
# root workspace pin (audited fork).
[patch.crates-io]
lora-phy        = { git = "https://github.com/darconeous/lora-rs.git", rev = "28bb48ce72591348d3731123a70bfe9e080ad880" }
lora-modulation = { git = "https://github.com/darconeous/lora-rs.git", rev = "28bb48ce72591348d3731123a70bfe9e080ad880" }
trouble-host    = { git = "https://github.com/darconeous/trouble.git", rev = "675edc8a373b58ccdeaf1821653b41e19e595bab" }

# The whole esp-hal family is pinned to a single repo rev instead of the
# crates.io releases. This revision includes BLE modem sleep (#6376),
# BLE-aware automatic light sleep (#6378), and the bt-hci 0.9 transport
# required by the audited trouble-host fork. The esp-hal fork adds BTDM
# initialization wake protection and wake-before-teardown to upstream
# 76a0e71d5ea8; modem sleep is opt-in. It also disarms the scheduler's
# standing wake deadline before deep sleep, which otherwise panics or
# ends the sleep early.
# Return to upstream once it includes these fixes, then crates.io
# once compatible releases include these changes.
# Family members must stay on the SAME rev (they share in-repo path deps).
esp-hal                = { git = "https://github.com/darconeous/esp-hal.git", rev = "5a55bb86021934c83be40d25b45a26922898ad91" }
esp-rtos               = { git = "https://github.com/darconeous/esp-hal.git", rev = "5a55bb86021934c83be40d25b45a26922898ad91" }
esp-radio              = { git = "https://github.com/darconeous/esp-hal.git", rev = "5a55bb86021934c83be40d25b45a26922898ad91" }
esp-alloc              = { git = "https://github.com/darconeous/esp-hal.git", rev = "5a55bb86021934c83be40d25b45a26922898ad91" }
esp-println            = { git = "https://github.com/darconeous/esp-hal.git", rev = "5a55bb86021934c83be40d25b45a26922898ad91" }
esp-bootloader-esp-idf = { git = "https://github.com/darconeous/esp-hal.git", rev = "5a55bb86021934c83be40d25b45a26922898ad91" }
esp-storage            = { git = "https://github.com/darconeous/esp-hal.git", rev = "5a55bb86021934c83be40d25b45a26922898ad91" }

# Xtensa needs optimization even in dev builds; unoptimized images are too
# slow to meet radio/BLE timing and blow past IRAM budgets.
[profile.dev]
opt-level = 3

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 3
overflow-checks = false
