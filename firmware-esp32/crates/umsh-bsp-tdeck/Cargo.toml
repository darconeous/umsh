[package]
name = "umsh-bsp-tdeck"
description = "LILYGO T-Deck and T-Deck Plus board support"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
ulcp-i2c = ["dep:umsh-ulcp", "dep:umsh-ulcp-device", "dep:umsh-ulcp-runtime"]
# Forwarded so every board BSP answers to the same feature. Nothing in
# this crate uses the chip BSP's BLE-owned RNG.
ble = ["umsh-bsp-esp32/ble"]

[dependencies]
umsh-ulcp = { path = "../../../crates/umsh-ulcp", default-features = false, optional = true }
umsh-ulcp-device = { path = "../../../crates/umsh-ulcp-device", default-features = false, optional = true }
umsh-ulcp-runtime = { path = "../../../crates/umsh-ulcp-runtime", default-features = false, features = ["i2c"], optional = true }
esp-hal = { version = "1.2", default-features = false, features = ["esp32s3", "rt", "unstable"] }
umsh-bsp-esp32 = { path = "../umsh-bsp-esp32", features = ["esp32s3"] }
umsh-display-st77xx = { path = "../../../crates/umsh-display-st77xx" }
umsh-tdeck-peripherals = { path = "../../../crates/umsh-tdeck-peripherals" }
umsh-gnss = { path = "../../../crates/umsh-gnss" }
embassy-time = "0.5"
embassy-sync = "0.8"
embassy-futures = "0.1"
embassy-embedded-hal = "0.6"
embedded-hal = "1"
critical-section = "1"
embedded-graphics = "0.8"
lora-phy = { version = "3.0.2-alpha", default-features = false }
nb = "1"
