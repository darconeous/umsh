[package]
name = "umsh-bsp-heltec-lora32-v2"
description = "Board BSP for the Heltec WiFi LoRa 32 V2: pin map, Vext power domain, SSD1306, SX1276 wiring"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
ulcp-i2c = ["dep:umsh-ulcp", "dep:umsh-ulcp-device", "dep:umsh-ulcp-runtime"]

[dependencies]
umsh-ulcp = { path = "../../../crates/umsh-ulcp", default-features = false, optional = true }
umsh-ulcp-device = { path = "../../../crates/umsh-ulcp-device", default-features = false, optional = true }
umsh-ulcp-runtime = { path = "../../../crates/umsh-ulcp-runtime", default-features = false, features = ["i2c"], optional = true }
umsh-bsp-esp32 = { path = "../umsh-bsp-esp32", features = ["esp32"] }
esp-hal = { version = "1.1", default-features = false, features = ["esp32", "rt", "unstable"] }
embassy-time = { version = "0.5", default-features = false }
nb = "1"
ssd1306 = { version = "0.10", default-features = false, features = ["async", "graphics"] }
# SX1276 driver; resolves to ../../lora-rs via the workspace [patch].
lora-phy = { version = "3.0.2-alpha", default-features = false }
embedded-hal-async = { version = "1", default-features = false }
embedded-hal-bus = { version = "0.3", default-features = false, features = ["async"] }

# `platform` module: the concrete `umsh_mac::Platform` bundle.
umsh-crypto = { path = "../../../crates/umsh-crypto", default-features = false, features = ["software-crypto"] }
umsh-hal = { path = "../../../crates/umsh-hal", default-features = false, features = ["embassy"] }
umsh-mac = { path = "../../../crates/umsh-mac", default-features = false }
umsh-radio-loraphy = { path = "../../../crates/umsh-radio-loraphy", default-features = false }
embassy-sync = { version = "0.8", default-features = false }

embassy-embedded-hal = { version = "0.6", default-features = false }
