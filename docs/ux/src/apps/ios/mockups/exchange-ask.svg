 y="370" width="358" height="132" rx="10" fill="#fff"/><text x="32.0" y="400.0" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" fill="#C4C4C7">UMSH URI, Base58 address, or 32-</text><text x="32.0" y="422.0" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" fill="#C4C4C7">byte hex key</text><path d="M32 458.5 H374" stroke="#E0E0E5" stroke-width="1"/><text x="32.0" y="486.0" font-family="-apple-system, 'SF Pro Text', system-ui, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#A3A3A8">Validate identity</text><rect width="390" height="844" fill="#000" opacity="0.38"/><path d="M0 532 a12 12 0 0 1 12 -12 H378 a12 12 0 0 1 12 12 V844 H0 Z" fill="#F2F2F7"/><rect x="177.0" y="526" width="36" height="5" rx="2.5" fill="#C7C7CC"/><g transform="translate(167.0,554.0) scale(2.0000)"><circle cx="14" cy="14" r="14" fill="#3DC6B1"/><rect x="9" y="9.5" width="10" height="13.5" rx="2" fill="none" stroke="#1C1C1E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M11.5 9.5 V4.5" fill="none" stroke="#1C1C1E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="11.2" y="12" width="5.6" height="3.6" rx="0.8" fill="none" stroke="#1C1C1E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="195.0" y="638.0" font-family="-apple-system, 'SF Pro Text', system-ui, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#6C6C70" text-anchor="middle">T-LoRa Pager</text><text x="195.0" y="672.0" font-family="-apple-system, 'SF Pro Text', system-ui, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#000" font-weight="700" text-anchor="middle">Exchange contacts?</text><rect x="16" y="700" width="358" height="50" rx="12" fill="#0A68D6"/><text x="195.0" y="731.0" font-family="-apple-system, 'SF Pro Text', system-ui, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#fff" font-weight="600" text-anchor="middle">Exchange</text><text x="195.0" y="790.0" font-family="-apple-system, 'SF Pro Text', system-ui, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#0A68D6" font-weight="600" text-anchor="middle">Not now</text></g></g>
<rect x="24" y="976" width="390" height="144" rx="8" fill="#DCE8FB"/>
<text x="40.0" y="1003.0" font-family="-apple-system, 'SF Pro Text', system-ui, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#1C2A44">Appears over Add Peer when a nearby device asks. The</text>
<text x="40.0" y="1023.0" font-family="-apple-system, 'SF Pro Text', system-ui, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#1C2A44">glyph and model match that device's row, and the person</text>
<text x="40.0" y="1043.0" font-family="-apple-system, 'SF Pro Text', system-ui, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#1C2A44">holding it is the identification. Exchange moves both</text>
<text x="40.0" y="1063.0" font-family="-apple-system, 'SF Pro Text', system-ui, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#1C2A44">screens to the code. Not now, or swiping the sheet</text>
<text x="40.0" y="1083.0" font-family="-apple-system, 'SF Pro Text', system-ui, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#1C2A44">away, declines; this phone's glyph and color change,</text>
<text x="40.0" y="1103.0" font-family="-apple-system, 'SF Pro Text', system-ui, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#1C2A44">since declining starts over under a new key.</text>
</svg>
