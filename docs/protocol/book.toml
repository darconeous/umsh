[book]
title = "UMSH Protocol Specification"
authors = ["UMSH Contributors"]
language = "en"
src = "src"

# Renders each UEP's TOML header and enforces the header rules in UEP-0001.
[preprocessor.uep]
command = "python3 ../../scripts/uep.py"

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
# Sidebar section numbers would read as UEP numbers.
no-section-label = true
