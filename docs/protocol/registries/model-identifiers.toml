policy = "Values 1 to 65023 (`0xFDFF`) name boards, and 65024 to 65279 (`0xFE00` to `0xFEFF`) host platforms with no fixed radio hardware, such as a phone. The project assigns them on request, without a UEP, in `docs/hardware/boards.json` and `docs/hardware/platforms.json`, from which this page is drawn. Values from 65280 (`0xFF00`) up are for hardware with no assignment."

