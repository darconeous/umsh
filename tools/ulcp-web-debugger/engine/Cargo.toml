[package]
name = "umsh-ulcp-web-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Sans-IO protocol engine for the UMSH ULCP web debugger"

[package.metadata.wasm-pack.profile.release]
# Keep local and CI builds self-contained; wasm-opt is an optional download and
# the debugger does not need maximum binary-size optimization.
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["sim-device"]
sim-device = ["dep:umsh-ulcp-simdev"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
umsh-ulcp = { path = "../../../crates/umsh-ulcp" }
umsh-ulcp-simdev = { path = "../../../crates/umsh-ulcp-simdev", optional = true }
umsh-core = { path = "../../../crates/umsh-core" }
umsh-gnss = { path = "../../../crates/umsh-gnss" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
