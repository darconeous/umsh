[project]
name = "regiondb-build"
version = "0.1.0"
description = "Compiler for the UMSH geographic region database"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pyogrio>=0.9",
    "pyproj>=3.6",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "shapely>=2.0",
]

[project.scripts]
regiondb-build = "regiondb_build.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regiondb_build"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# The test suite's shared paths module lives beside the tests, not in the
# package, so tell isort it is first-party rather than a third-party import.
known-first-party = ["paths", "regiondb_build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests share a small paths module; rootdir-relative imports keep it importable.
pythonpath = ["tests"]
