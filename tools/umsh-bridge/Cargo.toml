[package]
name = "umsh-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "UMSH internet bridge: joins the radios of one virtual repeater over a TLS tunnel"

[lib]
name = "umsh_bridge"
path = "src/lib.rs"

[[bin]]
name = "umsh-bridge"
path = "src/main.rs"

[features]
default = ["serial-radio", "ble-radio"]
serial-radio = ["umsh/serial-radio", "dep:tokio-serial"]
ble-radio = ["umsh/ble-radio"]

[dependencies]
umsh = { path = "../../umsh", default-features = false, features = ["std", "software-crypto", "tokio-support"] }
umsh-core = { path = "../../crates/umsh-core", features = ["std", "region-codec"] }
umsh-crypto = { path = "../../crates/umsh-crypto", features = ["std", "software-crypto"] }
umsh-hal = { path = "../../crates/umsh-hal", features = ["std"] }
umsh-mac = { path = "../../crates/umsh-mac", features = ["std", "software-crypto"] }
umsh-ulcp = { path = "../../crates/umsh-ulcp" }
tokio-serial = { version = "5", optional = true }
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
# Only to restore the default SIGPIPE disposition, so piping this tool's
# output into `head` ends it quietly rather than with a panic.
libc = "0.2"
rand = { version = "0.10.1", features = ["std", "thread_rng"] }
rcgen = "0.14"
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
sha2 = { version = "0.10", features = ["std"] }
time = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
# No `tls12`: the tunnel is TLS 1.3 only, and leaving the older protocol
# uncompiled is a stronger guarantee than declining to negotiate it.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
umsh-hal = { path = "../../crates/umsh-hal", features = ["std"] }
# `start_paused` runs the keepalive and staleness tests in virtual time.
tokio = { version = "1", features = ["test-util"] }
